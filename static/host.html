<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Camera</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --accent: #0071e3;
    --ok: #1f9d4c; --warn: #b26a00; --err: #d70015; --chip: #f0f0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: #38383a; --accent: #0a84ff;
      --ok: #30d158; --warn: #ffb340; --err: #ff6961; --chip: #2c2c2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; }
  .backend { color: var(--muted); font-size: 13px; }
  .backend.err { color: var(--err); }
  .seg { margin-left: auto; display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  .layout.fixed { grid-template-columns: 1fr; }
  .layout.fixed .join { display: none; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .join { text-align: center; position: sticky; top: 16px; }
  .join img { width: 240px; height: 240px; image-rendering: pixelated; background: #fff; border-radius: 8px; }
  .url { margin-top: 10px; font: 11px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; }
  .join ol { margin: 14px 0 0; padding-left: 20px; text-align: left; font-size: 13px; line-height: 1.7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .cam-head { display: flex; align-items: center; gap: 8px; }
  .cam-head h2 { margin: 0; font-size: 16px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .badge.ok { color: var(--ok); } .badge.ok::before { background: var(--ok); }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .chip.on { color: var(--accent); }
  .remove { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px;
    line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .remove:hover { background: var(--chip); color: var(--err); }
  .preview { margin-top: 12px; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden;
    display: grid; place-items: center; color: #8e8e93; font-size: 13px; }
  .preview img { width: 100%; height: 100%; object-fit: contain; }
  .cam-qr { display: none; margin-top: 12px; text-align: center; }
  .layout.fixed .cam-qr { display: block; }
  .cam-qr img { width: 180px; height: 180px; image-rendering: pixelated; background: #fff; border-radius: 6px; }
  .cam-qr p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 12px 0 0; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .err { color: var(--err); }
  .add { display: grid; place-items: center; min-height: 160px; border: 2px dashed var(--line); background: transparent;
    color: var(--muted); font: inherit; font-size: 15px; border-radius: 14px; cursor: pointer; }
  .add:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>iPhone Camera</h1>
    <span class="backend" id="backend"></span>
    <div class="seg" role="group" aria-label="割り当て方">
      <button type="button" data-mode="auto">自動割り当て</button>
      <button type="button" data-mode="fixed">カメラごとの QR</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <section class="card join">
      <img src="/qr.png" alt="iPhone で読み取る QR コード">
      <div class="url" id="url"></div>
      <ol>
        <li>iPhone のカメラで QR コードを読み取る (何台でも同じ QR でOK)</li>
        <li>Safari の警告で「詳細を表示」→「このWebサイトを閲覧」</li>
        <li>「開始」を押すと、空いている仮想カメラに割り当てられます</li>
      </ol>
    </section>

    <div class="grid" id="grid">
      <button type="button" class="add" id="add">＋ カメラを追加</button>
    </div>
  </div>
</main>

<template id="cam-template">
  <section class="card cam">
    <div class="cam-head">
      <h2 class="name"></h2>
      <span class="badge state"></span>
      <span class="chip use" hidden>アプリで使用中</span>
      <button type="button" class="remove" title="このカメラを削除">×</button>
    </div>
    <div class="preview"><img alt="" hidden><span class="novideo">iPhone を待っています</span></div>
    <div class="cam-qr"><img alt="このカメラ用の QR コード"><p>この QR から開いた iPhone はこのカメラに入ります</p></div>
    <dl>
      <dt>iPhone</dt><dd class="peer">—</dd>
      <dt>受信映像</dt><dd class="source">—</dd>
      <dt>PC 処理</dt><dd class="proc">—</dd>
    </dl>
    <p class="error err" hidden></p>
  </section>
</template>

<script>
const $ = (id) => document.getElementById(id);
const cards = new Map();

async function post(path, body, method = "POST") {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function createCard(cam) {
  const el = $("cam-template").content.firstElementChild.cloneNode(true);
  el.querySelector(".name").textContent = cam.name;
  el.querySelector(".cam-qr img").src = `/qr.png?cam=${cam.id}`;
  el.querySelector(".remove").addEventListener("click", async () => {
    const live = el.dataset.connected === "1";
    if (!confirm(`${cam.name} を削除しますか？${live ? "\n配信中の iPhone は切断されます。" : ""}`)) return;
    await post(`/cameras/${cam.id}`, {}, "DELETE").catch((e) => alert(e.message));
    poll();
  });
  $("grid").insertBefore(el, $("add"));
  return el;
}

function setPreview(el, cam) {
  const img = el.querySelector(".preview img");
  const on = cam.connected;
  if (on === !img.hidden) return;
  // MJPEG ストリームは src を外すと接続が切れる
  if (on) img.src = `/cameras/${cam.id}/preview.mjpg?${Date.now()}`;
  else img.removeAttribute("src");
  img.hidden = !on;
  el.querySelector(".novideo").hidden = on;
}

function updateCard(el, cam) {
  el.dataset.connected = cam.connected ? "1" : "0";
  const state = el.querySelector(".state");
  state.textContent = cam.connected ? "配信中" : "待機中";
  state.classList.toggle("ok", cam.connected);
  el.querySelector(".use").hidden = !cam.in_use;
  el.querySelector(".peer").textContent = cam.peer || "—";
  el.querySelector(".source").textContent = cam.connected && cam.source
    ? `${cam.source} / ${cam.fps} fps / ${cam.mbps} Mbps` : "—";
  el.querySelector(".proc").textContent = cam.connected
    ? `${cam.process_ms} ms/フレーム・欠落 ${cam.stalls ?? 0} 回` : "—";
  const error = el.querySelector(".error");
  error.hidden = !cam.error;
  error.textContent = cam.error ? `仮想カメラなし: ${cam.error}` : "";
  setPreview(el, cam);
}

function setMode(mode) {
  $("layout").classList.toggle("fixed", mode === "fixed");
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", b.dataset.mode === mode);
}

async function poll() {
  let s;
  try {
    s = await (await fetch("/status", { cache: "no-store" })).json();
  } catch {
    $("backend").textContent = "サーバーが停止しています";
    $("backend").classList.add("err");
    return;
  }
  $("url").textContent = s.url;
  $("backend").textContent = `仮想カメラ: ${s.backend.name} (${s.backend.size})` +
    (s.backend.multi ? "" : " — 1 台のみ。複数台には vcam\\install_vcam.bat");
  $("backend").classList.toggle("err", false);
  setMode(s.mode);

  const seen = new Set();
  for (const cam of s.cameras) {
    seen.add(cam.id);
    const el = cards.get(cam.id) ?? cards.set(cam.id, createCard(cam)).get(cam.id);
    updateCard(el, cam);
  }
  for (const [id, el] of cards) {
    if (!seen.has(id)) {
      el.remove();
      cards.delete(id);
    }
  }
}

for (const b of document.querySelectorAll(".seg button")) {
  b.addEventListener("click", async () => {
    setMode(b.dataset.mode);
    await post("/mode", { mode: b.dataset.mode }).catch((e) => alert(e.message));
  });
}
$("add").addEventListener("click", async () => {
  await post("/cameras").catch((e) => alert(e.message));
  poll();
});

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
